<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tillsatskoll</title>
<meta name="description" content="Skanna streckkoden och se vilka tillsatser varan innehåller och vad de gör.">
<meta name="theme-color" content="#0B0D0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tillsatskoll">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // Sätt tema innan sidan ritas så att den inte blinkar
  try { var t = localStorage.getItem('tk-tema'); if (t === 'ljust' || t === 'morkt') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<main id="app">

  <!-- Skanna: kameran tar hela skärmen -->
  <section id="vy-skanna" class="vy vy-kamera" aria-label="Skanna">
    <video id="kamera" playsinline muted aria-hidden="true"></video>
    <div class="kamera-topp">
      <span class="glas logga">Tillsatskoll</span>
      <button id="knapp-skriv" class="glas rund" type="button" aria-label="Skriv in streckkoden">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
      </button>
    </div>
    <div class="ram" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>
    <p id="skanna-hint" class="glas hint">Rikta mot streckkoden</p>
    <div id="kamera-fel" class="kamera-fel" hidden>
      <p id="kamera-fel-text"></p>
      <button id="knapp-starta" class="knapp-lime" type="button">Starta kameran</button>
    </div>
    <a id="senast" class="senast" href="#/" hidden></a>

    <form id="form-ean" class="ark" hidden novalidate>
      <label for="ean">Streckkod</label>
      <input id="ean" name="ean" inputmode="numeric" autocomplete="off" pattern="[0-9]*" placeholder="8 eller 13 siffror">
      <p id="ean-fel" class="fel" role="alert"></p>
      <div class="ark-knappar">
        <button type="button" id="knapp-avbryt" class="knapp-sekundar">Avbryt</button>
        <button type="submit" class="knapp-lime">Visa vara</button>
      </div>
    </form>
  </section>

  <section id="vy-produkt" class="vy" aria-label="Vara" hidden></section>
  <section id="vy-tillsats" class="vy" aria-label="Tillsats" hidden></section>
  <section id="vy-saknas" class="vy" aria-label="Varan saknas" hidden></section>
  <section id="vy-historik" class="vy" aria-label="Historik" hidden></section>
  <section id="vy-lexikon" class="vy" aria-label="Lexikon" hidden></section>

  <nav id="flikar" aria-label="Meny">
    <a href="#/" data-flik="skanna" aria-label="Skanna">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10"/></svg><span>Skanna</span>
    </a>
    <a href="#/historik" data-flik="historik" aria-label="Historik">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg><span>Historik</span>
    </a>
    <a href="#/lexikon" data-flik="lexikon" aria-label="Lexikon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5zM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg><span>Lexikon</span>
    </a>
  </nav>
</main>

<script src="https://cdn.jsdelivr.net/npm/barcode-detector@3.2.4/dist/iife/ponyfill.min.js" defer></script>
<script src="tillsatser.js" defer></script>
<script src="analys.js" defer></script>
<script src="lager.js" defer></script>
<script src="off.js" defer></script>
<script src="skanner.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
